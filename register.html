<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت‌نام بازدیدکننده</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">FUTURE CITY 2040</a><nav><a href="index.html">خانه</a><a href="exhibition.html">نمایشگاه</a><a class="active" href="register.html">ثبت‌نام</a></nav></header><main class="page narrow"><span class="tag">VISITOR REGISTRATION</span><h1>ثبت‌نام بازدیدکننده</h1><p class="lead">برای حضور در نمایشگاه، اطلاعات خود را وارد کنید.</p><form id="form"><label>نام و نام خانوادگی<input required name="name"></label><label>ایمیل<input required type="email" name="email"></label><label>روز بازدید<select required name="day"><option value="">انتخاب کنید</option><option>شنبه</option><option>یکشنبه</option><option>دوشنبه</option><option>سه‌شنبه</option></select></label><label>بخش مورد علاقه<select required name="interest"><option value="">انتخاب کنید</option><option>حمل‌ونقل هوشمند</option><option>شهر سبز</option><option>هوش مصنوعی در شهر</option><option>سلامت هوشمند</option></select></label><label>چرا دوست دارید از نمایشگاه بازدید کنید؟<textarea required rows="4"></textarea></label><button class="btn" type="submit">ثبت‌نام نهایی</button></form></main><script src="script.js"></script></body></html>
